
<nav class="align-items-center" aria-label="{{ 'common.pagination.title' | translate }}">

  <div class="mpdl-pagination">
    @if(totalNumberOfPages > 0) {
    <button type="button" class="btn btn-sm border border-0 focus-ring" (click)="first()"
            [disabled]="isFirst || loadingSignal()">
                <span class="material-symbols-outlined">
                    first_page
                </span>
    </button>
    <button type="button" class="btn btn-sm border border-0 focus-ring" (click)="prev()"
            [disabled]="isFirst || loadingSignal()">
                <span class="material-symbols-outlined">
                    navigate_before
                </span>
    </button>
    <span class="page-label" i18n="@@pagination.page">{{ 'common.pagination.page' | translate }}</span>
    <input type="text" class="form-control page-input mx-2" [formControl]="pageNumberField"
           (keyup.enter)="jumpToPage()" [attr.aria-label]="'common.pagination.page' | translate">
    <span class="page-of" i18n="@@pagination.of">{{ 'common.pagination.of' | translate }}</span><span class="page-total text-nowrap">{{totalNumberOfPages | number}}</span>
    <button type="button" class="btn btn-sm border border-0 focus-ring" (click)="next()"
            [disabled]="isLast || loadingSignal()">
                <span class="material-symbols-outlined">
                    navigate_next
                </span>
    </button>
    <button type="button" class="btn btn-sm border border-0 focus-ring" (click)="last()"
            [disabled]="isLast || loadingSignal()">
                <span class="material-symbols-outlined">
                    last_page
                </span>
    </button>
    }
    @if(size > 1 && totalNumberOfPages > 0){
    <select class="form-select page-size" [formControl]="sizeField"
            (change)="itemPerPageChange($event)" size="1"
            [attr.aria-label]="'common.pagination.itemsPerPage' | translate">
      @for (pages of itemPerPageOptions; track pages) {
        <option [value]="pages.value">{{pages.label}}</option>
      }

    </select>
    }
  </div>
</nav>
