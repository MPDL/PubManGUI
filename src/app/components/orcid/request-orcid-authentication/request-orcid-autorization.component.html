<div class="orcid-request-wrap py-3 px-2 px-md-4">
  <div class="card shadow-sm border-0">
    <div class="card-body p-3 p-md-4">
      <h2 class="h4 mb-4">Request ORCID Authentication</h2>

      <form [formGroup]="orcidRequestForm" class="d-flex flex-column gap-3">
        <div>
          <label for="researcherName" class="form-label mb-1">Researcher Name</label>
          <input type="text" id="researcherName" class="form-control" formControlName="researcherName" readonly>
        </div>

        <div>
          <label for="coneId" class="form-label mb-1">CONE ID</label>
          <div class="input-group">
            <input type="text" id="coneId" class="form-control" formControlName="coneId" readonly>
            @if(orcidRequestForm.get('coneId')?.value) {
              <span class="btn btn-outline-dark btn-sm d-flex align-items-center px-3">
                <pure-cone-icon [coneId]="orcidRequestForm.get('coneId')?.value" [button]="true"/>
              </span>
            }
          </div>
        </div>

        <div>
          <label for="orcidId" class="form-label mb-1">ORCID ID</label>
          <div class="input-group">
            <input type="text" id="orcidId" class="form-control" formControlName="orcidId" readonly>
            @if(orcidRequestForm.get('orcidId')?.value) {
              <span class="btn btn-outline-dark btn-sm d-flex align-items-center px-3">
                <pure-cone-icon [orcid]="orcidRequestForm.get('orcidId')?.value" [button]="true"/>
              </span>
            }
          </div>
        </div>

        <div>
          <label for="email" class="form-label mb-1">Researcher Email</label>
          <input type="email" id="email" class="form-control" formControlName="researcherEmail">
        </div>

        <div>
          <label for="modEmail" class="form-label mb-1">Moderator Email</label>
          <input type="text" id="modEmail" class="form-control" formControlName="moderatorEmail">
        </div>

        <div class="pt-2">
          <button type="submit" class="btn btn-primary px-4">Submit</button>
        </div>
      </form>
    </div>
  </div>
</div>
